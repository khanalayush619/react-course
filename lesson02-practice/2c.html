<!doctype html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      function TextMessage() {
        return (
          <>
            <p>Hello, welcome to my webiste</p>
          </>
        );
      }

      function TextBoxes({ placeholder }) {
        const text = placeholder;
        return (
          <div>
            {text === "Email" && <input type="email" placeholder={text} />}
            {text === "Password" && (
              <input type="password" placeholder={text} />
            )}
          </div>
        );
      }

      function Buttons({ btnText }) {
        return (
          <>
            <button>{btnText}</button>
          </>
        );
      }

      function App() {
        return (
          <>
            <TextMessage />
            <TextBoxes placeholder="Email" />
            <TextBoxes placeholder="Password" />
            <Buttons btnText="Login" />
            <Buttons btnText="Sign up" />
          </>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
